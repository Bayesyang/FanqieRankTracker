name: Force Update (Re-scrape + Re-summarize)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fanqie-rank-writes-main
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '更新频道'
        type: choice
        options: [all, female, male]
        default: all
      target_date:
        description: '目标日期 (YYYYMMDD)，默认当天'
        required: false
        default: ''
        type: string

jobs:
  force-update:
    runs-on: ubuntu-22.04
    env:
      RANK_CHANNEL: ${{ inputs.channel || 'all' }}
      TARGET_DATE_INPUT: ${{ inputs.target_date }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main
        fetch-depth: 0

    - name: Sync Latest Main
      run: git pull --ff-only origin main

    - name: Determine target date
      id: date
      run: |
        python - <<'PY'
        import os
        from datetime import datetime, timezone
        today = datetime.now(timezone.utc).strftime('%Y%m%d')
        target = os.environ.get('TARGET_DATE_INPUT', '').strip() or today
        if len(target) != 8 or not target.isdigit():
            raise ValueError('目标日期必须为 YYYYMMDD')
        date = datetime.strptime(target, '%Y%m%d')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f"target={target}\nis_today={str(target == today).lower()}\ndash_date={date:%Y-%m-%d}\n")
        print(f'目标日期: {date:%Y-%m-%d}')
        PY

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ "${{ steps.date.outputs.is_today }}" = "true" ]; then
          playwright install --with-deps chromium
        fi

    - name: Run Scraper (仅当天)
      if: steps.date.outputs.is_today == 'true'
      run: python scrape_fanqie_ranks.py --channel "$RANK_CHANNEL" --force

    - name: Build Latest Data with AI Summary (Force)
      run: pip install openai && python scripts/build_latest.py --channel "$RANK_CHANNEL" --force --date ${{ steps.date.outputs.dash_date }}
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_KEY: ${{ secrets.API_KEY }}
        API_MODEL: ${{ secrets.API_MODEL }}

    - name: Sync Latest Main Before Commit
      run: git pull --rebase --autostash origin main

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "[Force] Re-summarize Fanqie ranks (${{ steps.date.outputs.dash_date }})"
        file_pattern: data api
        branch: main

    # ---- Deploy to GitHub Pages ----
    - name: Setup Pages
      uses: actions/configure-pages@v6
      with:
        enablement: true

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
