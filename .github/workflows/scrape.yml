name: Daily Fanqie Rank Scraper

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fanqie-rank-writes-main
  cancel-in-progress: false

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 触发
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: '采集频道'
        type: choice
        options: [all, female, male]
        default: all

jobs:
  scrape-and-commit:
    runs-on: ubuntu-22.04
    env:
      RANK_CHANNEL: ${{ inputs.channel || 'all' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main
        fetch-depth: 0

    - name: Sync Latest Main
      run: git pull --ff-only origin main

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Run Scraper
      run: python scrape_fanqie_ranks.py --channel "$RANK_CHANNEL"

    - name: Build Latest Data with AI Summary
      run: pip install openai && python scripts/build_latest.py --channel "$RANK_CHANNEL"
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_KEY: ${{ secrets.API_KEY }}
        API_MODEL: ${{ secrets.API_MODEL }}

    - name: Sync Latest Main Before Commit
      run: git pull --rebase --autostash origin main

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "[Auto] Update Fanqie daily ranks"
        file_pattern: data api
        branch: main

    # ---- Deploy to GitHub Pages (inline, 绕过 GITHUB_TOKEN 不触发其他 workflow 的限制) ----
    - name: Setup Pages
      uses: actions/configure-pages@v6
      with:
        enablement: true

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
